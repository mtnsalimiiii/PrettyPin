
services:
  # PostgreSQL Database
  db:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - prettypin_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - prettypin_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Django Migrations and Static Files
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: prettypin-backend:latest
    container_name: migrate

    restart: "no"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - prettypin_network

  # Django + Gunicorn
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: prettypin-backend:latest
    container_name: backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - prettypin_network

  # Celery Worker
  celery:
    image: prettypin-backend:latest
    container_name: celery

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    volumes:
      - ./backend:/app
      - media_volume:/app/mediafiles

    command: celery -A prettypin worker --loglevel=info

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - prettypin_network

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}

    image: prettypin-frontend:latest
    container_name: frontend

    restart: unless-stopped

    ports:
      - "5173:4173"

    depends_on:
      - backend

    networks:
      - prettypin_network

# Named Volumes
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

# Network
networks:
  prettypin_network:
    driver: bridge
